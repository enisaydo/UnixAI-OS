# podman-compose up -d   veya   podman compose up -d   (docker compose ile de çalışır)
services:
  unixai-os:
    build:
      context: .
    image: localhost/unixai-os:latest
    container_name: unixai-os
    user: root
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
    volumes:
      - ./data:/app/data:Z
      - ./logs:/app/logs:Z
      # root SSH anahtarı (unixai_ed25519) ve known_hosts
      - /root/.ssh:/root/.ssh:z
